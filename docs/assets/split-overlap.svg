<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" role="img"
     aria-labelledby="title desc" width="560" height="400">
  <!--
    Palette reason: slate ink (#1f2933) for the split record-count bars, the
    clean measured data, and one accent, warning amber (#b45309), reserved for
    the contamination edges between splits, the thing the reader should look at
    first. A lighter slate (#7b8794) is a neutral for axes and labels. Two
    colours plus one accent, flat fills, no gradient.

    Number sources, all from a real run of:
      python -m evalleak report samples/train.manifest \
        samples/validation.manifest samples/test.manifest
    Record counts: train 6, validation 3, test 3.
    Cross-split contamination findings per split pair:
      train and test: 2 (one exact, one containment)
      train and validation: 1 (one near)
      validation and test: 0
    Intra-split duplicates in train: 1.
    Total distinct contaminated records: 8.
  -->
  <title id="title">evalleak split overlap</title>
  <desc id="desc">Record counts per split as bars: train six, validation three,
    test three. Contamination findings between split pairs: train and test two,
    train and validation one, validation and test zero. Train has one
    intra-split duplicate. Total contaminated records eight.</desc>

  <rect x="0" y="0" width="560" height="400" fill="#ffffff"/>

  <text x="32" y="40" font-family="-apple-system, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif"
        font-size="18" font-weight="700" fill="#1f2933">Records per split and contamination between splits</text>

  <!-- Bar chart of record counts. Scale: 24px per record. -->
  <g font-family="-apple-system, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif"
     font-size="13" fill="#1f2933">
    <!-- baseline at y=250, bars grow upward -->
    <line x1="120" y1="250" x2="520" y2="250" stroke="#7b8794" stroke-width="1"/>

    <!-- train: 6 records, height 144 -->
    <rect x="150" y="106" width="72" height="144" fill="#1f2933"/>
    <text x="186" y="270" text-anchor="middle" fill="#1f2933">train</text>
    <text x="186" y="98" text-anchor="middle" fill="#1f2933" font-weight="700">6</text>

    <!-- validation: 3 records, height 72 -->
    <rect x="290" y="178" width="72" height="72" fill="#1f2933"/>
    <text x="326" y="270" text-anchor="middle" fill="#1f2933">validation</text>
    <text x="326" y="170" text-anchor="middle" fill="#1f2933" font-weight="700">3</text>

    <!-- test: 3 records, height 72 -->
    <rect x="430" y="178" width="72" height="72" fill="#1f2933"/>
    <text x="466" y="270" text-anchor="middle" fill="#1f2933">test</text>
    <text x="466" y="170" text-anchor="middle" fill="#1f2933" font-weight="700">3</text>

    <text x="120" y="90" text-anchor="end" fill="#7b8794">records</text>
  </g>

  <!-- Contamination edge summary as a labelled table below the bars. -->
  <g font-family="&quot;Cascadia Mono&quot;, &quot;JetBrains Mono&quot;, Consolas, &quot;DejaVu Sans Mono&quot;, monospace"
     font-size="13">
    <text x="32" y="312" font-family="-apple-system, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif"
          font-size="14" font-weight="700" fill="#1f2933">contamination findings between splits</text>

    <text x="48" y="336" fill="#1f2933">train and test</text>
    <text x="520" y="336" text-anchor="end" fill="#b45309" font-weight="700">2</text>

    <text x="48" y="358" fill="#1f2933">train and validation</text>
    <text x="520" y="358" text-anchor="end" fill="#b45309" font-weight="700">1</text>

    <text x="48" y="380" fill="#1f2933">validation and test</text>
    <text x="520" y="380" text-anchor="end" fill="#7b8794" font-weight="700">0</text>
  </g>
</svg>

