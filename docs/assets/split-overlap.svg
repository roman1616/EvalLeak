<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" role="img"
     aria-labelledby="title desc" width="560" height="400">
  <!--
    Palette reason: slate ink (#1f2933) for the split record-count bars, the
    clean measured data, and one accent, warning amber (#b45309), reserved for
    the contamination edges between splits, the thing the reader should look at
    first. A lighter slate (#7b8794) is a neutral for axes and labels. Two
    colours plus one accent, flat fills, no gradient.

    Number sources, all from a real run of:
      python -m evalleak report samples/train.manifest \
        samples/validation.manifest samples/test.manifest
    Record counts: train 6, validation 3, test 3.
    Cross-split contamination findings per split pair:
      train and test: 2 (one exact, one containment)
      train and validation: 1 (one near)
      validation and test: 0
    Intra-split duplicates in train: 1.
    Total distinct contaminated records: 8.
  -->
